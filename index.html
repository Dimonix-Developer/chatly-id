
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160821">
<title>Chatly ID</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:22px;
 display:flex;align-items:center;justify-content:center;
 font-family:Arial,sans-serif;color:white;
 background:
 radial-gradient(ellipse at 15% 10%,#8c1b9e 0,transparent 40%),
 radial-gradient(ellipse at 90% 90%,#3512a0 0,transparent 45%),
 #100817;
}
.container{width:100%;max-width:430px}
.logo{text-align:center;font-size:40px;font-weight:900;margin-bottom:8px}
.logo span{color:#f04cff}
.subtitle{text-align:center;color:#d8b5e9;margin-bottom:28px}
.panel{
 background:#190d25;border:1px solid #a52bce;
 border-radius:28px;padding:26px;
 box-shadow:0 0 35px #a020c044;
}
h1{text-align:center;font-size:27px;margin:0 0 8px}
.description{text-align:center;color:#c4a8d1;margin-bottom:22px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tabs button{
 flex:1;margin:0;padding:12px;background:#291634;
 color:#d9b8e8;border:1px solid #563368;
}
.tabs button.active{background:linear-gradient(100deg,#ed35e9,#713aff);color:white}
label{display:block;margin:15px 0 8px;color:#e8c9f5}
input{
 width:100%;padding:15px;border-radius:14px;
 border:1px solid #74418b;background:#100819;
 color:white;font-size:16px;outline:none;
}
input:focus{border-color:#ed42ff;box-shadow:0 0 12px #d52aff55}
.action{
 width:100%;padding:16px;border:0;border-radius:15px;
 margin-top:22px;background:linear-gradient(100deg,#ed35e9,#713aff);
 color:white;font-size:17px;font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.6;cursor:wait}
.status{text-align:center;color:#e3b3ff;margin-top:15px;min-height:20px;font-size:14px}
.bottom{text-align:center;color:#b99ac9;font-size:12px;margin-top:22px}
.hidden{display:none!important}
.account{text-align:center;overflow-wrap:anywhere}
.account p{color:#d8b5e9;line-height:1.6}
.hint{font-size:12px;color:#b99ac9;margin-top:7px}
</style>
</head>

<body>
<div class="container">
 <div class="logo">Chatly <span>VI</span></div>
 <div class="subtitle">Один ID — вся экосистема Chatly</div>

 <div class="panel">
  <div id="authPanel">
   <h1>Chatly ID</h1>
   <div class="description">Твой единый аккаунт</div>

   <div class="tabs">
    <button class="active" id="loginTab" type="button">Вход</button>
    <button id="registerTab" type="button">Регистрация</button>
   </div>

   <form id="authForm">
    <div id="usernameField" class="hidden">
     <label for="username">Придумай Chatly ID</label>
     <input id="username" maxlength="20"
       placeholder="Например, Dima_2026"
       autocomplete="username">
     <div class="hint">3–20 символов: латинские буквы, цифры и _</div>
    </div>

    <label for="email">Email</label>
    <input id="email" type="email" required
      placeholder="name@example.com" autocomplete="email">

    <label for="password">Пароль</label>
    <input id="password" type="password" required
      minlength="6" placeholder="Не менее 6 символов"
      autocomplete="current-password">

    <button class="action" id="submitButton" type="submit">
     Войти в Chatly ID →
    </button>
   </form>

   <div class="status" id="status" aria-live="polite"></div>
   <div class="bottom">Chatly ID · Chatly Guard</div>
  </div>

  <div id="accountPanel" class="hidden account">
   <h1>Ты в Chatly ID!</h1>
   <p>Авторизация прошла успешно.</p>
   <p id="accountEmail"></p>
   <button class="action" id="logoutButton">Выйти</button>
  </div>
 </div>
</div>

<script type="module">
import { initializeApp }
 from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
 getAuth, createUserWithEmailAndPassword,
 signInWithEmailAndPassword, onAuthStateChanged,
 signOut, deleteUser
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 getFirestore, doc, runTransaction, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

// Конфигурация нового приложения Chatly ID
const firebaseConfig = {
 apiKey: "AIzaSyD3Er2iVY6H5Gvj3YdF6Cj34EJXIXyEiiU",
 authDomain: "chatly-19613.firebaseapp.com",
 projectId: "chatly-19613",
 storageBucket: "chatly-19613.firebasestorage.app",
 messagingSenderId: "1080401916394",
 appId: "1:1080401916394:web:a7fb0c1c5807d0744c8293",
 measurementId: "G-N7J83W8FK7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);

let mode = "login";

function message(text){
 $("status").textContent = text;
}

function setMode(next){
 mode = next;
 $("loginTab").classList.toggle("active",mode==="login");
 $("registerTab").classList.toggle("active",mode==="register");
 $("usernameField").classList.toggle("hidden",mode!=="register");
 $("submitButton").textContent =
  mode==="login" ? "Войти в Chatly ID →" : "Создать Chatly ID →";
 $("password").autocomplete =
  mode==="login" ? "current-password" : "new-password";
 message("");
}

$("loginTab").onclick = () => setMode("login");
$("registerTab").onclick = () => setMode("register");

function showAccount(user){
 $("authPanel").classList.add("hidden");
 $("accountPanel").classList.remove("hidden");
 $("accountEmail").textContent = "Email: " + user.email;
}

function showAuth(){
 $("accountPanel").classList.add("hidden");
 $("authPanel").classList.remove("hidden");
}

onAuthStateChanged(auth,user=>{
 if(user) showAccount(user);
 else showAuth();
});

function readableError(error){
 const errors = {
  "auth/email-already-in-use":"Этот Email уже зарегистрирован.",
  "auth/invalid-email":"Проверь правильность Email.",
  "auth/weak-password":"Пароль должен содержать минимум 6 символов.",
  "auth/invalid-credential":"Неверный Email или пароль.",
  "auth/too-many-requests":"Слишком много попыток. Попробуй позже.",
  "permission-denied":"Firebase запретил операцию. Проверь правила доступа."
 };
 return errors[error.code] || error.message || "Неизвестная ошибка.";
}

$("authForm").addEventListener("submit",async event=>{
 event.preventDefault();

 const email = $("email").value.trim();
 const password = $("password").value;
 const button = $("submitButton");

 button.disabled = true;
 message("Подключаемся...");

 try{
  if(mode==="login"){
   await signInWithEmailAndPassword(auth,email,password);
   message("Вход выполнен!");
  }else{
   const username = $("username").value.trim();
   const normalized = username.toLowerCase();

   if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){
    throw new Error("Chatly ID: 3–20 символов, только латинские буквы, цифры и _.");
   }

   if(password.length<6){
    throw new Error("Пароль должен содержать минимум 6 символов.");
   }

   const credential =
    await createUserWithEmailAndPassword(auth,email,password);

   try{
    await runTransaction(db,async transaction=>{
     const usernameRef = doc(db,"usernames",normalized);
     const userRef = doc(db,"users",credential.user.uid);

     const existing = await transaction.get(usernameRef);

     if(existing.exists()){
      throw new Error("Это имя Chatly ID уже занято.");
     }

     transaction.set(usernameRef,{
      uid:credential.user.uid
     });

     transaction.set(userRef,{
      username:username,
      createdAt:serverTimestamp(),
      verified:false,
      badges:[]
     });
    });

    message("Chatly ID успешно создан!");
   }catch(error){
    await deleteUser(credential.user);
    throw error;
   }
  }
 }catch(error){
  message(readableError(error));
 }finally{
  button.disabled = false;
 }
});

$("logoutButton").onclick = async ()=>{
 try{
  await signOut(auth);
  message("Ты вышел из аккаунта.");
 }catch(error){
  alert(readableError(error));
 }
};
</script>
</body>
</html>
