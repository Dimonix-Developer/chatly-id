<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111318">
<title>Chatly ID</title>

<style>
:root {
  color-scheme:dark;
  --bg:#111318;
  --surface:#1e1f25;
  --surface2:#292a31;
  --primary:#d0bcff;
  --on-primary:#381e72;
  --text:#e4e1e9;
  --muted:#c5c0cc;
  --outline:#49454f;
  --error:#ffb4ab;
}
body.light {
  color-scheme:light;
  --bg:#f6f2fa;
  --surface:#fff;
  --surface2:#eee8f4;
  --primary:#6750a4;
  --on-primary:#fff;
  --text:#1d1b20;
  --muted:#625d68;
  --outline:#79747e;
  --error:#ba1a1a;
}
* {box-sizing:border-box}
body {
  margin:0;min-height:100vh;padding:22px;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);
  font-family:Roboto,Arial,sans-serif;
  transition:background .25s,color .25s;
}
button,input {font:inherit}
.container {
  width:100%;max-width:440px;opacity:0;
  transform:translateY(12px);
  transition:opacity .5s,transform .5s;
}
body.ready .container {opacity:1;transform:translateY(0)}
.top {display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}
.logo {font-size:28px;font-weight:800;letter-spacing:-1px}
.logo span,.loader-title span {color:var(--primary)}
.theme {
  width:46px;height:46px;border:0;border-radius:50%;
  background:var(--surface2);color:var(--text);
  cursor:pointer;font-size:20px;
}
.intro {text-align:center;margin-bottom:28px}
.icon {
  width:76px;height:76px;margin:0 auto 18px;
  border-radius:26px;display:grid;place-items:center;
  background:var(--surface2);color:var(--primary);
  font-size:35px;font-weight:800;
}
.intro h1 {margin:0 0 9px;font-size:30px;letter-spacing:-1px}
.intro p {margin:0;color:var(--muted);line-height:1.5}
.card {
  background:var(--surface);border-radius:32px;padding:25px;
  border:1px solid var(--outline);box-shadow:0 12px 35px #00000018;
}
.tabs {
  display:flex;padding:5px;background:var(--surface2);
  border-radius:50px;margin-bottom:25px;
}
.tabs button {
  flex:1;border:0;border-radius:50px;padding:13px 8px;
  color:var(--muted);background:transparent;cursor:pointer;font-weight:600;
}
.tabs button.active {background:var(--primary);color:var(--on-primary)}
.field {margin-bottom:18px}
label {display:block;margin-bottom:9px;font-size:14px;font-weight:600}
input {
  width:100%;min-height:56px;padding:0 17px;
  border:1px solid var(--outline);border-radius:17px;
  background:var(--surface2);color:var(--text);
  outline:none;font-size:16px;transition:border .2s;
}
input:focus {border:2px solid var(--primary)}
input::placeholder {color:var(--muted)}
.hint {color:var(--muted);font-size:12px;margin-top:8px;line-height:1.4}
.action {
  width:100%;min-height:56px;border:0;border-radius:50px;
  background:var(--primary);color:var(--on-primary);
  font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;
  transition:transform .15s,opacity .15s;
}
.action:active,.social-button:active {transform:scale(.98)}
button:disabled {opacity:.55;cursor:not-allowed}
.text-button {
  display:block;width:100%;border:0;background:transparent;
  color:var(--primary);padding:13px 8px;margin-top:5px;
  font-size:14px;font-weight:600;cursor:pointer;
}
.social-login {display:grid;gap:12px;margin-top:18px}
.social-button {
  width:100%;min-height:54px;display:flex;align-items:center;
  justify-content:center;gap:12px;border:1px solid var(--outline);
  border-radius:50px;background:var(--surface2);color:var(--text);
  font-size:15px;font-weight:700;cursor:pointer;
  transition:transform .15s,background .2s;
}
.google-icon {font-size:21px;font-weight:900;color:#4285F4}
.apple-icon {font-size:20px}
.apple-button {opacity:.55;cursor:not-allowed}
.status {
  min-height:22px;margin-top:17px;text-align:center;
  font-size:13px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere;
}
.status.error {color:var(--error)}
.footer {text-align:center;margin-top:22px;font-size:12px;color:var(--muted)}
.account {text-align:center}
.account h2 {margin-top:0}
.account p {color:var(--muted);line-height:1.6}
.account-icon {
  width:68px;height:68px;margin:0 auto 18px;
  display:grid;place-items:center;border-radius:50%;
  background:var(--surface2);color:var(--primary);font-size:30px;
}
.hidden {display:none!important}
.loader-screen {
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;background:var(--bg);
  transition:opacity .45s,visibility .45s;
}
.loader-screen.done {opacity:0;visibility:hidden;pointer-events:none}
.loader-logo {
  width:86px;height:86px;border-radius:29px;
  display:grid;place-items:center;background:var(--surface2);
  color:var(--primary);font-size:43px;font-weight:800;
  animation:logoPulse 1.5s ease-in-out infinite;
  box-shadow:0 0 45px #d0bcff20;
}
.loader-title {margin-top:22px;font-size:27px;font-weight:800;letter-spacing:-1px}
.loader-caption {margin-top:9px;color:var(--muted);font-size:13px}
.loader-track {
  width:145px;height:4px;margin-top:27px;
  border-radius:10px;background:var(--surface2);overflow:hidden;
}
.loader-progress {
  width:40%;height:100%;border-radius:10px;
  background:var(--primary);animation:loading 1.2s ease-in-out infinite;
}
@keyframes loading {
  0% {transform:translateX(-110%)}
  100% {transform:translateX(360%)}
}
@keyframes logoPulse {
  0%,100% {transform:scale(1)}
  50% {transform:scale(1.06)}
}
@media(max-width:420px) {
  body {padding:17px}
  .card {padding:21px}
  .intro h1 {font-size:27px}
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<div class="loader-screen" id="loaderScreen">
  <div class="loader-logo">C</div>
  <div class="loader-title">Chatly <span>ID</span></div>
  <div class="loader-caption">Подготавливаем твой аккаунт...</div>
  <div class="loader-track"><div class="loader-progress"></div></div>
</div>

<div class="container">
  <div class="top">
    <div class="logo">Chatly <span>ID</span></div>
    <button class="theme" id="themeButton" type="button" aria-label="Переключить тему">☀</button>
  </div>

  <div class="intro">
    <div class="icon">C</div>
    <h1>Твой мир Chatly</h1>
    <p>Один аккаунт для всей экосистемы Chatly</p>
  </div>

  <div class="card">
    <div id="authPanel">
      <div class="tabs">
        <button id="loginTab" class="active" type="button">Вход</button>
        <button id="registerTab" type="button">Регистрация</button>
      </div>

      <form id="authForm">
        <div class="field hidden" id="usernameField">
          <label for="username">Твой Chatly ID</label>
          <input id="username" maxlength="20" placeholder="Например, Dima_2026" autocomplete="username">
          <div class="hint">3–20 символов: латинские буквы, цифры и _</div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="name@example.com" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Пароль</label>
          <input id="password" type="password" required minlength="6" placeholder="Не менее 6 символов" autocomplete="current-password">
        </div>

        <button class="action" id="submitButton" type="submit">Войти в Chatly</button>
      </form>

      <button class="text-button" id="forgotPasswordButton" type="button">Забыли пароль?</button>

      <div class="social-login">
        <button class="social-button" id="googleLoginButton" type="button">
          <span class="google-icon">G</span>Войти через Google
        </button>
        <button class="social-button apple-button" type="button" disabled>
          <span class="apple-icon">●</span>Apple ID — скоро
        </button>
      </div>

      <div class="status" id="status" aria-live="polite"></div>
    </div>

    <div id="accountPanel" class="hidden account">
      <div class="account-icon">✓</div>
      <h2>Добро пожаловать!</h2>
      <p>Ты вошёл в свой Chatly ID.</p>
      <p id="accountEmail"></p>

      <button class="action hidden" id="addPasswordButton" type="button">Добавить пароль</button>
      <div class="status" id="accountStatus" aria-live="polite"></div>
      <button class="action" id="logoutButton" type="button">Выйти из аккаунта</button>
    </div>
  </div>

  <div class="footer">Chatly ID · Единый аккаунт Chatly</div>
</div>

<script>
const themeButton = document.getElementById("themeButton");

function setTheme(theme) {
  document.body.classList.toggle("light", theme === "light");
  themeButton.textContent = theme === "light" ? "☾" : "☀";
  document.querySelector('meta[name="theme-color"]').setAttribute(
    "content", theme === "light" ? "#f6f2fa" : "#111318"
  );
}

let savedTheme = "dark";
try {
  savedTheme = localStorage.getItem("chatly-id-theme") || "dark";
} catch {}

setTheme(savedTheme);

themeButton.addEventListener("click", () => {
  const next = document.body.classList.contains("light") ? "dark" : "light";
  setTheme(next);
  try {
    localStorage.setItem("chatly-id-theme", next);
  } catch {}
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  deleteUser,
  GoogleAuthProvider,
  signInWithPopup,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  runTransaction,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD3Er2iVYH6G5vj3YdF6Cj34EJXIXyEiiU",
  authDomain: "chatly-19613.firebaseapp.com",
  projectId: "chatly-19613",
  storageBucket: "chatly-19613.firebasestorage.app",
  messagingSenderId: "1080401916394",
  appId: "1:1080401916394:web:a7fb0c1c5807d0744c8293",
  measurementId: "G-N7J83W8FK7"
};

const $ = id => document.getElementById(id);

/* Безопасный возврат в основной Chatly */
const MAIN_CHATLY_ORIGIN = "https://dimasitokhov-droid.github.io";
const MAIN_CHATLY_PATH = "/Chatly---call-your-friends-and-chat/";

function getSafeReturnUrl() {
  const raw = new URLSearchParams(location.search).get("returnUrl");
  if (!raw) return null;

  try {
    const url = new URL(raw);

    if (url.origin !== MAIN_CHATLY_ORIGIN) return null;

    if (
      url.pathname !== MAIN_CHATLY_PATH &&
      url.pathname !== MAIN_CHATLY_PATH + "index.html"
    ) return null;

    return url.href;
  } catch {
    return null;
  }
}

const chatlyReturnUrl = getSafeReturnUrl();

function returnToChatly() {
  if (chatlyReturnUrl) {
    location.replace(chatlyReturnUrl);
  }
}

let auth;
let db;
let mode = "login";
let authOperationInProgress = false;
let firstAuthCheckFinished = false;

function hideLoader() {
  $("loaderScreen").classList.add("done");
  document.body.classList.add("ready");
}

function finishInitialCheck() {
  if (firstAuthCheckFinished) return;
  firstAuthCheckFinished = true;
  hideLoader();
}

function message(text, error = false) {
  $("status").textContent = text;
  $("status").classList.toggle("error", error);
}

function accountMessage(text, error = false) {
  $("accountStatus").textContent = text;
  $("accountStatus").classList.toggle("error", error);
}

function showAccount(user) {
  $("authPanel").classList.add("hidden");
  $("accountPanel").classList.remove("hidden");
  $("accountEmail").textContent = user.email || "Google-аккаунт";

  const hasPassword = user.providerData.some(
    provider => provider.providerId === "password"
  );

  $("addPasswordButton").classList.toggle(
    "hidden", hasPassword || !user.email
  );

  accountMessage("");
}

function showAuth() {
  $("accountPanel").classList.add("hidden");
  $("authPanel").classList.remove("hidden");
}

function setMode(next) {
  mode = next;

  $("loginTab").classList.toggle("active", mode === "login");
  $("registerTab").classList.toggle("active", mode === "register");
  $("usernameField").classList.toggle("hidden", mode !== "register");
  $("username").required = mode === "register";

  $("submitButton").textContent =
    mode === "login" ? "Войти в Chatly" : "Создать Chatly ID";

  $("password").autocomplete =
    mode === "login" ? "current-password" : "new-password";

  $("forgotPasswordButton").classList.toggle(
    "hidden", mode !== "login"
  );

  message("");
}

$("loginTab").onclick = () => setMode("login");
$("registerTab").onclick = () => setMode("register");

function readableError(error) {
  const errors = {
    "auth/api-key-not-valid":"Firebase не принимает API-ключ. Проверь конфигурацию Firebase.",
    "auth/invalid-api-key":"API-ключ Firebase указан неверно.",
    "auth/email-already-in-use":"Этот Email уже зарегистрирован.",
    "auth/invalid-email":"Проверь правильность Email.",
    "auth/weak-password":"Пароль должен содержать минимум 6 символов.",
    "auth/invalid-credential":"Неверный Email или пароль.",
    "auth/too-many-requests":"Слишком много попыток. Попробуй позже.",
    "auth/network-request-failed":"Проверь подключение к Интернету.",
    "auth/popup-closed-by-user":"Окно Google было закрыто.",
    "auth/popup-blocked":"Браузер заблокировал окно входа. Разреши всплывающие окна.",
    "auth/cancelled-popup-request":"Запрос входа был отменён.",
    "auth/unauthorized-domain":"Домен сайта не добавлен в Firebase Authorized domains.",
    "auth/account-exists-with-different-credential":"Этот Email уже используется другим способом входа. Попробуй войти прежним способом.",
    "auth/user-not-found":"Аккаунт с таким Email не найден.",
    "auth/missing-email":"Сначала введи Email.",
    "auth/invalid-action-code":"Ссылка недействительна или уже использована. Запроси новое письмо.",
    "permission-denied":"Firebase запретил операцию. Нужно проверить правила Firestore."
  };

  return errors[error.code] || error.message || "Неизвестная ошибка.";
}

/* Подключение Firebase */
try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  auth.languageCode = "ru";

  onAuthStateChanged(auth, user => {
    if (user) {
      showAccount(user);

      // Если пользователь уже вошёл, возвращаем его в основной Chatly
      if (!authOperationInProgress) {
        finishInitialCheck();
        returnToChatly();
      }
    } else {
      showAuth();
    }

    if (!authOperationInProgress) {
      finishInitialCheck();
    }
  }, error => {
    message("Ошибка проверки аккаунта: " + readableError(error), true);
    finishInitialCheck();
  });

  setTimeout(() => {
    if (!firstAuthCheckFinished) {
      message("Firebase долго отвечает. Проверь подключение к Интернету.", true);
      finishInitialCheck();
    }
  }, 12000);

} catch (error) {
  message("Не удалось запустить Firebase: " + readableError(error), true);
  finishInitialCheck();
}

/* Вход и регистрация через Email */
$("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  if (!auth || !db) {
    message("Firebase не подключён. Проверь конфигурацию.", true);
    return;
  }

  const email = $("email").value.trim();
  const password = $("password").value;
  const button = $("submitButton");

  authOperationInProgress = true;
  button.disabled = true;
  message("Подключаемся к Chatly...");

  try {
    if (mode === "login") {
      const credential = await signInWithEmailAndPassword(auth, email, password);

      showAccount(credential.user);
      message("");
      returnToChatly();

    } else {
      const username = $("username").value.trim();
      const normalized = username.toLowerCase();

      if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
        throw new Error("Chatly ID должен содержать 3–20 символов: латинские буквы, цифры и _.");
      }

      if (password.length < 6) {
        throw new Error("Пароль должен содержать минимум 6 символов.");
      }

      const credential = await createUserWithEmailAndPassword(auth, email, password);

      try {
        await runTransaction(db, async transaction => {
          const usernameRef = doc(db, "usernames", normalized);
          const userRef = doc(db, "users", credential.user.uid);
          const existing = await transaction.get(usernameRef);

          if (existing.exists()) {
            throw new Error("Этот Chatly ID уже занят.");
          }

          transaction.set(usernameRef, {uid:credential.user.uid});

          transaction.set(userRef, {
            username:username,
            createdAt:serverTimestamp(),
            verified:false,
            badges:[]
          });
        });

        showAccount(credential.user);
        message("");
        returnToChatly();

      } catch (error) {
        try {
          await deleteUser(credential.user);
        } catch (deleteError) {
          console.error("Не удалось удалить незавершённый аккаунт:", deleteError);
        }
        throw error;
      }
    }

  } catch (error) {
    console.error("Chatly ID error:", error);
    message(readableError(error), true);

  } finally {
    authOperationInProgress = false;
    button.disabled = false;

    if (auth?.currentUser &&
        !$("accountPanel").classList.contains("hidden")) {
      showAccount(auth.currentUser);
    } else if (!auth?.currentUser) {
      showAuth();
    }
  }
});

/* Вход через Google */
$("googleLoginButton").onclick = async () => {
  if (!auth) {
    message("Firebase не подключён.", true);
    return;
  }

  const button = $("googleLoginButton");
  button.disabled = true;
  authOperationInProgress = true;
  message("Выполняется вход через Google...");

  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({prompt:"select_account"});

    const result = await signInWithPopup(auth, provider);

    showAccount(result.user);
    message("");
    returnToChatly();

  } catch (error) {
    console.error("Google login error:", error);
    message(readableError(error), true);

  } finally {
    authOperationInProgress = false;
    button.disabled = false;
  }
};

/* Забыли пароль? */
$("forgotPasswordButton").onclick = async () => {
  if (!auth) {
    message("Firebase не подключён.", true);
    return;
  }

  const email = $("email").value.trim();

  if (!email) {
    message("Сначала введи свой Email в поле выше.", true);
    $("email").focus();
    return;
  }

  if (!$("email").checkValidity()) {
    message("Проверь правильность Email.", true);
    $("email").focus();
    return;
  }

  const button = $("forgotPasswordButton");
  button.disabled = true;
  message("Отправляем письмо...");

  try {
    await sendPasswordResetEmail(auth, email);
    message("Если для этого Email доступен сброс пароля, письмо отправлено. Проверь входящие и папку «Спам».");
  } catch (error) {
    console.error("Password reset error:", error);
    message(readableError(error), true);
  } finally {
    button.disabled = false;
  }
};

/* Добавить пароль Google-аккаунту */
$("addPasswordButton").onclick = async () => {
  const user = auth?.currentUser;

  if (!user || !user.email) {
    accountMessage("Не удалось определить Email аккаунта.", true);
    return;
  }

  const hasPassword = user.providerData.some(
    provider => provider.providerId === "password"
  );

  if (hasPassword) {
    accountMessage("У этого аккаунта уже есть пароль.");
    $("addPasswordButton").classList.add("hidden");
    return;
  }

  const button = $("addPasswordButton");
  button.disabled = true;
  accountMessage("Отправляем письмо для установки пароля...");

  try {
    await sendPasswordResetEmail(auth, user.email);
    accountMessage(
      "Письмо отправлено на " + user.email +
      ". Открой его и перейди по ссылке, чтобы установить пароль. Проверь также папку «Спам»."
    );
  } catch (error) {
    console.error("Add password error:", error);
    accountMessage(readableError(error), true);
  } finally {
    button.disabled = false;
  }
};

/* Выход */
$("logoutButton").onclick = async () => {
  try {
    await signOut(auth);
    message("Ты вышел из аккаунта.");
  } catch (error) {
    accountMessage(readableError(error), true);
  }
};
</script>

</body>
</html>
